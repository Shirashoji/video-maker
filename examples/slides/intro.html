<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 80px 120px;
    }
    .card {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      padding: 64px 80px;
      width: 100%;
      max-width: 1500px;
      text-align: center;
    }
    .tag {
      display: inline-block;
      padding: 10px 28px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      font-weight: 700;
      font-size: 24px;
      letter-spacing: 0.08em;
      margin-bottom: 32px;
    }
    h1 {
      font-size: 78px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 24px;
      background: linear-gradient(135deg, #38bdf8, #818cf8 50%, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 32px;
      color: #94a3b8;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">NEXT-GEN VIDEO MAKER</div>
    <h1>HTML & Mermaid で創る<br>次世代 AI 動画制作</h1>
    <p>Web標準の表現力と自動ダイアグラムで、AIエージェントの動画編集が圧倒的に簡単に。</p>
  </div>
</body>
</html>
