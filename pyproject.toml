[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-maker"
version = "0.1.0"
description = "Local, reproducible video editing tools for AI agents"
requires-python = ">=3.11"
dependencies = ["mcp>=1.20,<2", "pydantic>=2.11,<3", "Pillow>=11,<13", "psd-tools>=1.10,<2", "resvg-py>=0.5.0,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "PyYAML>=6,<7"]

[project.scripts]
video-maker = "video_maker.cli:main"
video-maker-mcp = "video_maker.server:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
